<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Krizaka Motion — the lab</title>
    <meta name="description" content="Krizaka Motion, the lab: generative visuals played live — an engine's flow, a voice's presence, light through glass. What proves itself moves into Krizaka UI." />
    <!-- The theme before the first paint (the choice kept as kz-theme, else the system's): never a flash. -->
    <script>
      try {
        var m = localStorage.getItem("kz-theme") || "system";
        var light = m === "light" || (m === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("light", light);
        document.documentElement.classList.toggle("dark", !light);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
