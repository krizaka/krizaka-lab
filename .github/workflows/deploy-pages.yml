name: Deploy the lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo: relative asset paths (vite base "./"), one folder per REST route, 404.html for any other deep link.
      - run: pnpm run build
      - run: test -f dist-demo/index.html && test -f dist-demo/404.html && test -f dist-demo/orazaka/index.html
      # 360–1440 px, dark and light: no page of the lab scrolls sideways.
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm exec vite preview --outDir dist-demo --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/check-overflow.mjs --base http://localhost:4173
          # The engine flow's dots travel and the engine breathes (reduced motion OFF; still when ON).
          node scripts/check-motion.mjs --base http://localhost:4173
          # The Maps demo on real tiles (the basemap CDN answers CORS on maps/v1).
          node scripts/check-maps.mjs --base http://localhost:4173
          # The conversation, journey and figures demos play (and rest under reduced motion).
          node scripts/check-demos.mjs --base http://localhost:4173
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
