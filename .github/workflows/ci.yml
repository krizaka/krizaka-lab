name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's older run is cancelled: main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    # A check script that hangs (a headless page waiting for ever) must fail the job, not hold a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm's version comes from package.json "packageManager"; its settings from pnpm-workspace.yaml (never .npmrc:
      # `only-built-dependencies=esbuild` there is a string, and the action's installer crashed on it — the Pages demo
      # never deployed).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The lab is English only: its catalogue is complete (no empty string, valid placeholders and markup — @krizaka/i18n).
      - run: pnpm exec krizaka-i18n check messages
      # The gallery's code is the demo that renders (one file per card); a card, prop or word that drifts fails here.
      - run: node scripts/check-gallery.mjs
      - run: pnpm run build
      - run: pnpm test
      # A real browser, reduced motion OFF: the engine flow's dots travel and the engine breathes (check-overflow runs under
      # reduced motion and cannot see a frozen figure).
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm exec vite preview --outDir dist-demo --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/check-motion.mjs --base http://localhost:4173
          node scripts/check-demos.mjs --base http://localhost:4173
          CHECKOUT_BASE=http://localhost:4173 node --test tests/checkout-browser.test.mjs
          # Every gallery card works as its words say, and the experiments run smooth (reduced motion OFF and ON).
          node scripts/check-cards.mjs --base http://localhost:4173
          node scripts/check-experiments.mjs --base http://localhost:4173
          node scripts/check-studies.mjs --base http://localhost:4173
