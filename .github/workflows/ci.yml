name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's older run is cancelled: main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The shared Node CI (krizaka/.github, rule shared-ci); what only the lab checks is scripts/ci-after-build.sh.
    uses: krizaka/.github/.github/workflows/node-ci.yml@07c5db4045e7e31e462da7069df5debbdac9bf80 # main
    permissions:
      contents: read
    with:
      package-manager: pnpm
      lint-script: lint
      typecheck-script: typecheck
      # The unit tests read the built demo (dist-demo): they run in after-build, once the build exists.
      test-script: ""
      playwright: chromium
      after-build: scripts/ci-after-build.sh
      timeout-minutes: 30

  # The required check keeps its name.
  build:
    name: Typecheck, build, test
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
