<svg width="64" height="64" viewBox="86 82 228 228" fill="none" xmlns="http://www.w3.org/2000/svg"><style>
svg { --kz-text-primary: hsl(240 6% 10%); --kz-text-secondary: hsl(240 4% 41%); --kz-border-default: hsl(240 6% 0% / .10); --kz-border-strong: hsl(240 6% 0% / .16); }
